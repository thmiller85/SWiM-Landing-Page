<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;background:#DCDAD1}
  .card .ground{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* The type sits on the plaster wall, not on a panel — the wall is already
     an even, near-paper tone, and a panel would read as a sticker. A soft
     scrim only deepens it enough to hold the ink. */
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(100deg,
      rgba(220,218,209,.94) 0%,
      rgba(220,218,209,.90) 34%,
      rgba(220,218,209,.42) 52%,
      rgba(220,218,209,0) 68%);
  }
  .type{
    position:absolute; left:74px; top:0; height:630px; width:520px;
    display:flex; flex-direction:column; justify-content:center; gap:0;
  }
  .eyebrow{
    font-family:Archivo,sans-serif; font-weight:700;
    font-size:17px; letter-spacing:.2em; text-transform:uppercase;
    color:#6B1F2A;
  }
  h1{
    font-family:Literata,Georgia,serif; font-weight:600;
    font-size:62px; line-height:1.03; letter-spacing:-.015em;
    color:#141518; margin-top:22px; text-wrap:balance;
  }
  .sub{
    font-family:Archivo,sans-serif; font-size:21px; line-height:1.42;
    color:#3C3B36; margin-top:20px; max-width:19em;
  }
  .foot{
    position:absolute; left:74px; bottom:52px;
    display:flex; align-items:center; gap:15px;
  }
  /* The real mark, printed in one ink — same file the page uses. The span
     needs its own box: a block-level image inside a bare inline span leaves
     the span zero-width, and the row collapses on top of it. */
  .logo{ display:inline-flex; align-items:center; }
  .logo img{ display:block; height:46px; width:auto; }
  .bar{ width:1px; height:30px; background:#B0ACA0; }
  .price{ font-family:Archivo,sans-serif; font-weight:700; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:#4A4943; }
</style>
<div class="card">
  <img class="ground" src="ground.jpg" alt="">
  <div class="scrim"></div>
  <div class="type">
    <div class="eyebrow">For independent boutiques</div>
    <h1>Retail Planning Suite</h1>
    <p class="sub">Open-to-buy, built from your own sales history.</p>
  </div>
  <div class="foot">
    <span class="logo"><img src="swim-ink.png" alt="SWiM"></span>
    <span class="bar"></span>
    <span class="price">$299/month</span>
  </div>
</div>
